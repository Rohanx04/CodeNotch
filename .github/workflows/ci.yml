name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # The app never needs a debug symbol server, and CI disks are small.
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  core:
    name: core tests (${{ matrix.os }})
    # codenotch-core has no Tauri or GUI dependency, so it is tested on Linux
    # for speed and on Windows because that is where it actually ships.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: Test
        working-directory: src-tauri/core
        run: cargo test --all-features

      - name: Clippy
        working-directory: src-tauri/core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test fixtures are reproducible
        if: matrix.os == 'ubuntu-latest'
        run: |
          python3 scripts/gen_test_fixtures.py
          cd src-tauri/core && cargo test

  windows-check:
    name: windows type-check (from Linux)
    # The whole application, Win32 layer included, type-checks without a Windows
    # runner because it pulls in no C-compiled dependencies.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: win-check

      # tauri-build needs the frontend output directory to exist.
      - run: mkdir -p dist && touch dist/index.html

      - name: Check
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-msvc --all-targets

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --target x86_64-pc-windows-msvc --all-targets -- -D warnings

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  build:
    name: windows installer
    needs: [core, windows-check, frontend]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: bundle

      - run: npm ci

      - name: Build installers
        run: npm run tauri:build

      - uses: actions/upload-artifact@v4
        with:
          name: codenotch-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
