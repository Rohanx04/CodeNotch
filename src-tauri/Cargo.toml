[workspace]
members = ["core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"

[package]
name = "codenotch"
version = "0.1.0"
description = "A Windows HUD overlay for AI coding-assistant usage limits"
authors = ["CodeNotch contributors"]
license = "MIT"
repository = "https://github.com/Rohanx04/CodeNotch"
edition = "2021"
rust-version = "1.82"

[lib]
# Tauri wants the app logic in a lib so integration tests and mobile targets can
# reuse it; `codenotch_lib` avoids colliding with the binary name on Windows.
name = "codenotch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }

# native-tls => schannel on Windows: no bundled C crypto, uses the OS trust store.
reqwest = { version = "0.13", default-features = false, features = [
  "json",
  "charset",
  "http2",
  "native-tls",
  "system-proxy",
] }

codenotch-core = { path = "core" }

anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security_Credentials",
  "Win32_System_Com",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"

[features]
# Tauri's `custom-protocol` is what `tauri build` turns on to embed the frontend.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
